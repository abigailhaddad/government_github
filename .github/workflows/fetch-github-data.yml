name: Fetch Federal GitHub Activity

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Fetch GitHub activity data
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python fetch_github_activity.py
        
    - name: Validate generated data
      run: |
        # Check if data file exists
        if [ ! -f "deploy/data/github_activity.json" ]; then
          echo "❌ Error: Data file not generated"
          exit 1
        fi
        
        # Validate JSON structure
        python -c "
        import json, sys
        try:
            with open('deploy/data/github_activity.json') as f:
                data = json.load(f)
            
            # Check required top-level keys
            required_keys = ['agencies', 'generated_at', 'total_agencies', 'active_agencies']
            for key in required_keys:
                if key not in data:
                    print(f'❌ Missing required key: {key}')
                    sys.exit(1)
            
            # Check we have agencies data
            if len(data['agencies']) < 20:
                print(f'❌ Too few agencies: {len(data[\"agencies\"])} (expected 20+)')
                sys.exit(1)
                
            # Log activity status (but don't fail on zero activity)
            print(f'📊 Activity summary: {data[\"active_agencies\"]} agencies active, {data.get(\"total_commits\", 0)} commits, {data.get(\"total_prs\", 0)} PRs')
                
            print(f'✅ Data validation passed: {len(data[\"agencies\"])} agencies, {data[\"active_agencies\"]} active')
            
        except json.JSONDecodeError as e:
            print(f'❌ Invalid JSON: {e}')
            sys.exit(1)
        except Exception as e:
            print(f'❌ Validation error: {e}')
            sys.exit(1)
        "
        
    # The refreshed data is not committed. fetch_github_activity.py writes
    # github_activity.json from scratch on every run and never reads the previous
    # copy, so nothing is preserved by committing it. The site ships straight from
    # the working tree: the deploy step below uploads the deploy/ folder as it
    # stands after the fetch.

    # Cloudflare Pages is the only host (see DEPLOY.md). Secret:
    # CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit). Variables:
    # CLOUDFLARE_ACCOUNT_ID, and optionally CLOUDFLARE_PROJECT (default
    # federal-github-activity). The check below fails the run when the
    # credentials or the site folder are missing, so a run never ends green
    # without publishing.
    - name: Check the site folder and deploy credentials
      env:
        HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        fail=0
        for f in deploy/index.html deploy/_headers deploy/data/github_activity.json; do
          if [ ! -s "$f" ]; then echo "::error::$f is missing or empty"; fail=1; fi
        done
        if [ "$HAS_TOKEN" != "true" ]; then echo "::error::secret CLOUDFLARE_API_TOKEN is not set"; fail=1; fi
        if [ -z "$ACCOUNT_ID" ]; then echo "::error::variable CLOUDFLARE_ACCOUNT_ID is not set"; fail=1; fi
        exit $fail

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        wranglerVersion: "4.42.0"
        command: pages deploy deploy --project-name=${{ vars.CLOUDFLARE_PROJECT || 'federal-github-activity' }} --branch=main
