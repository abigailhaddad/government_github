name: Fetch Federal GitHub Activity

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write     # to publish the site
      id-token: write  # required by actions/deploy-pages

    # deploy-pages publishes through this environment; the URL it reports shows
    # up on the run summary.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Fetch GitHub activity data
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python fetch_github_activity.py
        
    - name: Validate generated data
      run: |
        # Check if data file exists
        if [ ! -f "deploy/data/github_activity.json" ]; then
          echo "❌ Error: Data file not generated"
          exit 1
        fi
        
        # Validate JSON structure
        python -c "
        import json, sys
        try:
            with open('deploy/data/github_activity.json') as f:
                data = json.load(f)
            
            # Check required top-level keys
            required_keys = ['agencies', 'generated_at', 'total_agencies', 'active_agencies']
            for key in required_keys:
                if key not in data:
                    print(f'❌ Missing required key: {key}')
                    sys.exit(1)
            
            # Check we have agencies data
            if len(data['agencies']) < 20:
                print(f'❌ Too few agencies: {len(data[\"agencies\"])} (expected 20+)')
                sys.exit(1)
                
            # Log activity status (but don't fail on zero activity)
            print(f'📊 Activity summary: {data[\"active_agencies\"]} agencies active, {data.get(\"total_commits\", 0)} commits, {data.get(\"total_prs\", 0)} PRs')
                
            print(f'✅ Data validation passed: {len(data[\"agencies\"])} agencies, {data[\"active_agencies\"]} active')
            
        except json.JSONDecodeError as e:
            print(f'❌ Invalid JSON: {e}')
            sys.exit(1)
        except Exception as e:
            print(f'❌ Validation error: {e}')
            sys.exit(1)
        "
        
    # The refreshed data is no longer committed. fetch_github_activity.py writes
    # github_activity.json from scratch on every run and never reads the previous
    # copy, and the old commit only ever reached the throwaway prod branch, so
    # nothing was being preserved -- committing it now would just add ~2 MB of
    # regenerable JSON to main every day. It ships straight from the working tree
    # to Pages instead.

    # Published to GitHub Pages, not Netlify. Netlify bills per deploy -- this
    # site was spending about half of the whole account's monthly deploy budget
    # on its own -- while Pages does not meter builds. That also retires the
    # prod branch this workflow used to force-recreate and push on every run:
    # the branch existed only as a Netlify build trigger, and deploying the
    # directory directly is what it was standing in for.
    - name: Upload the site
      uses: actions/upload-pages-artifact@v3
      with:
        path: deploy

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4